<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema Móvil de Pedidos y Ventas CONORTE.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CONORTE POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CONORTE POS Móvil</title>
  <link rel="manifest" href="manifest.json">
  <script>
    window._flutter = {};
    let loaderInstance;
    Object.defineProperty(window._flutter, 'loader', {
      get: () => loaderInstance,
      set: (loader) => {
        loaderInstance = loader;
        if (loader) {
          const originalLoad = loader.load;
          loader.load = function(options) {
            if (options && options.serviceWorkerSettings) {
              const isSecure = window.location.protocol === 'https:' || 
                               window.location.hostname === 'localhost' || 
                               window.location.hostname === '127.0.0.1';
              if (!isSecure) {
                console.log("Contexto no seguro: desactivando Service Worker para evitar error de HTTPS forzado en Safari.");
                options.serviceWorkerSettings = null;
              }
            }
            return originalLoad.call(this, options);
          };
        }
      },
      configurable: true
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
